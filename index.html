<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Ujian Informatika</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      color:#0b5394;
    }

    .info{
      margin-bottom:20px;
      line-height:1.7;
    }

    .soal{
      margin-bottom:25px;
      padding:15px;
      border:1px solid #ddd;
      border-radius:8px;
      background:#fafafa;
    }

    .soal p{
      font-weight:bold;
    }

    label{
      display:block;
      margin:6px 0;
      cursor:pointer;
    }

    button{
      width:100%;
      padding:15px;
      background:#0b5394;
      color:white;
      border:none;
      border-radius:8px;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#073763;
    }

    .benar{
      background:#c6efce;
      padding:5px;
      border-radius:5px;
    }

    .salah{
      background:#ffc7ce;
      padding:5px;
      border-radius:5px;
    }

    #hasil{
      margin-top:20px;
      font-size:22px;
      text-align:center;
      font-weight:bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Simulasi Ujian Informatika</h1>

  <div class="info">
    <b>Mata Pelajaran:</b> Informatika<br>
    <b>Kelas:</b> VII Semester 2<br>
    <b>Jumlah Soal:</b> 40 Pilihan Ganda
  </div>

  <form id="quiz"></form>

  <button onclick="cekJawaban()">Koreksi Jawaban</button>

  <div id="hasil"></div>
</div>

<script>

},
{

},
{
t:"Rumus untuk menjumlahkan data adalah?",

},
{

},
{

},
{

j:"MIN"
},
{

o:["Menghitung jumlah data","Menjumlahkan data","Mencari rata-rata","Mencari nilai terbesar"],
j:"Menghitung jumlah data"
},
{
t:"SUMIF digunakan untuk?",
o:["Menghitung data","Menjumlah data dengan syarat","Mencari nilai terbesar","Membagi data"],
j:"Menjumlah data dengan syarat"
},
{

},
{
t:"Manfaat analisis data dalam kehidupan sehari-hari adalah?",
o:["Membantu mengambil keputusan","Menghapus file","Merusak komputer","Menggambar"],
j:"Membantu mengambil keputusan"
},
{
t:"Aplikasi yang digunakan untuk membuat animasi blok adalah?",

j:"Scratch"
},
{
t:"Blok gerakan pada Scratch disebut?",
o:["Motion","Sound","Looks","Control"],
j:"Motion"
},
{
t:"Blok suara pada Scratch disebut?",
o:["Looks","Sound","Events","Motion"],
j:"Sound"
},
{
t:"Teknologi dapat memberikan dampak positif berupa?",
o:["Malas belajar","Mempermudah komunikasi","Cyberbullying","Kecanduan game"],
j:"Mempermudah komunikasi"
},
{
t:"Contoh dampak negatif teknologi adalah?",
o:["Belajar online","Cyberbullying","Mencari informasi","Video call"],
j:"Cyberbullying"
},
{
t:"Penggunaan media sosial yang bijak adalah?",
o:["Menghina teman","Menyebar hoax","Menggunakan dengan sopan","Membully orang"],
j:"Menggunakan dengan sopan"
},
{
t:"Apa yang dimaksud cyberbullying?",
o:["Belajar online","Perundungan di dunia maya","Belanja online","Main game"],
j:"Perundungan di dunia maya"
},
{
t:"Jejak digital adalah?",

j:"Rekam aktivitas di internet"
},
{
t:"Contoh jejak digital adalah?",

},
{
t:"Workbook pada Excel adalah?",

},
{
t:"Bagian tempat mengetik rumus disebut?",

j:"Formula Bar"
},
{
t:"Ctrl + C digunakan untuk?",

j:"Menyalin"
},
{
t:"Ctrl + V digunakan untuk?",
o:["Menempel","Menyalin","Menyimpan","Membuka"],
j:"Menempel"
},
{
t:"Data angka di Excel biasanya rata?",
o:["Kiri","Kanan","Tengah","Atas"],
j:"Kanan"
},
{
t:"Data teks di Excel biasanya rata?",
o:["Kanan","Kiri","Bawah","Atas"],
j:"Kiri"
},
{
t:"Scratch menggunakan sistem pemrograman?",

},
{

j:"Belajar dan komunikasi"
},
{

o:["Excel","Paint","Scratch","Chrome"],

},
{

o:[".docx",".xlsx",".ppt",".html"],
j:".xlsx"
},
{
t:"Apa fungsi MIN pada Excel?",
o:["Nilai terbesar","Nilai terkecil","Jumlah data","Rata-rata"],
j:"Nilai terkecil"
},
{
t:"Apa fungsi MAX pada Excel?",
o:["Nilai terbesar","Nilai terkecil","Jumlah data","Rata-rata"],
j:"Nilai terbesar"
},
{
t:"Mengunggah foto sembarangan di internet dapat mempengaruhi?",
o:["Jejak digital","Kesehatan","Olahraga","Makanan"],
j:"Jejak digital"
},
{
t:"Sikap yang baik di media sosial adalah?",
o:["Sopan santun","Menghina","Menyebar fitnah","Marah-marah"],

},
{
t:"Cyberbullying dapat menyebabkan korban merasa?",

j:"Sedih"
},
{

o:["Komunikasi","Memperlambat pekerjaan","Menghapus data","Merusak alat"],
j:"Komunikasi"
},
{
t:"Scratch cocok digunakan untuk belajar?",
o:["Animasi dan coding","Olahraga","Memasak","Menggambar manual"],
j:"Animasi dan coding"
}
];

const quiz = document.getElementById("quiz");

soal.forEach((s,index)=>{
  let div = document.createElement("div");
  div.className = "soal";

  let html = `<p>${index+1}. ${s.t}</p>`;

  s.o.forEach(opt=>{
    html += `
      <label>
        <input type="radio" name="soal${index}" value="${opt}">
        ${opt}
      </label>
    `;
  });

  div.innerHTML = html;
  quiz.appendChild(div);
});

function cekJawaban(){
  let benar = 0;

  soal.forEach((s,index)=>{
    const pilihan = document.querySelector(`input[name="soal${index}"]:checked`);
    const labels = document.querySelectorAll(`input[name="soal${index}"]`);

    labels.forEach(l=>{
      l.parentElement.classList.remove("benar","salah");

      if(l.value === s.j){
        l.parentElement.classList.add("benar");
      }

      if(pilihan && l.checked && l.value !== s.j){
        l.parentElement.classList.add("salah");
      }
    });

    if(pilihan && pilihan.value === s.j){
      benar++;
    }
  });

  document.getElementById("hasil").innerHTML =
    `Nilai Anda: ${benar}/40`;
}
</script>

</body>
</html>
