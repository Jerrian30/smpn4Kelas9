<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Informatika</title>

<style>
body{
    font-family: Arial;
    background:#f1f5f9;
    padding:10px;
    margin:0;
}

.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:10px;
}

h2{
    text-align:center;
}

.soal{
    margin-bottom:25px;
    padding-bottom:15px;
    border-bottom:1px solid #ccc;
}

.pilihan{
    margin-top:8px;
}

label{
    display:block;
    margin:6px 0;
    padding:8px;
    border-radius:5px;
}

.benar{
    background:lightgreen;
}

.salah{
    background:#ffb3b3;
}

.pembahasan{
    margin-top:8px;
    background:#eee;
    padding:8px;
    border-radius:5px;
    display:none;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#2563eb;
    color:white;
    font-size:16px;
    border-radius:5px;
}

#hasil{
    margin-top:20px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.timer{
    text-align:center;
    margin-bottom:15px;
    font-size:18px;
    color:red;
}

.progress{
    width:100%;
    height:10px;
    background:#ddd;
    margin-bottom:20px;
    border-radius:10px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:green;
}
</style>
</head>
<body>

<div class="container">

<h2>Ujian Informatika</h2>

<div class="timer" id="timer">60:00</div>

<div class="progress">
    <div class="progress-bar" id="bar"></div>
</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Kumpulkan Jawaban</button>

<div id="hasil"></div>

</div>

<script>

const baseQuestions = [

{
question:"Fungsi utama Microsoft Excel adalah...",
options:[
"Membuat video",
"Mengelola dan menghitung data",
"Mengedit gambar",
"Membuat game"
],
answer:1,
explanation:"Excel digunakan untuk mengolah data dan perhitungan."
},

{
question:"Rumus rata-rata pada Excel adalah...",
options:[
"=SUM()",
"=AVERAGE()",
"=MAX()",
"=COUNT()"
],
answer:1,
explanation:"AVERAGE digunakan untuk menghitung rata-rata."
},

{
question:"SUMIF digunakan untuk...",
options:[
"Menghapus data",
"Menjumlahkan data dengan syarat",
"Mengurutkan data",
"Mencari nilai terbesar"
],
answer:1,
explanation:"SUMIF menjumlahkan data berdasarkan syarat tertentu."
},

{
question:"Objek pada ScratchJr disebut...",
options:[
"Stage",
"Sprite",
"Frame",
"Canvas"
],
answer:1,
explanation:"Sprite adalah karakter atau objek."
},

{
question:"Cara menghindari hoax adalah...",
options:[
"Langsung membagikan berita",
"Memeriksa sumber informasi",
"Percaya judul saja",
"Mengikuti komentar"
],
answer:1,
explanation:"Berita harus dicek kebenarannya."
}

];

const questions = [];

for(let i=0;i<40;i++){
    questions.push({...baseQuestions[i % baseQuestions.length]});
}

const quiz = document.getElementById("quiz");

questions.forEach((q,index)=>{

    let pilihan = "";

    q.options.forEach((opt,i)=>{

        pilihan += `
        <label class="pilihan">
            <input type="radio" name="q${index}" value="${i}">
            ${opt}
        </label>
        `;

    });

    quiz.innerHTML += `
    <div class="soal">
        <p><b>${index+1}. ${q.question}</b></p>

        ${pilihan}

        <div class="pembahasan">
            <b>Pembahasan:</b> ${q.explanation}
        </div>
    </div>
    `;

});

document.querySelectorAll("input").forEach(input=>{

    input.addEventListener("change",()=>{

        const total = document.querySelectorAll("input:checked").length;

        const persen = (total/questions.length)*100;

        document.getElementById("bar").style.width = persen + "%";

    });

});

function submitQuiz(){

    let benar = 0;

    questions.forEach((q,index)=>{

        const selected = document.querySelector(`input[name="q${index}"]:checked`);

        const options = document.querySelectorAll(`input[name="q${index}"]`);

        options.forEach((opt,i)=>{

            const label = opt.parentElement;

            opt.disabled = true;

            if(i == q.answer){
                label.classList.add("benar");
            }

            if(selected && parseInt(selected.value) == i && i != q.answer){
                label.classList.add("salah");
            }

        });

        if(selected && parseInt(selected.value) == q.answer){
            benar++;
        }

        document.querySelectorAll(".pembahasan")[index].style.display = "block";

    });

    const nilai = Math.round((benar/questions.length)*100);

    document.getElementById("hasil").innerHTML = `
    Nilai: ${nilai}<br>
    Benar: ${benar}<br>
    Salah: ${questions.length - benar}
    `;

}


// TIMER
let time = 60 * 60;

const timer = document.getElementById("timer");

const hitung = setInterval(()=>{

    let menit = Math.floor(time/60);
    let detik = time%60;

    timer.innerHTML = `
    ${String(menit).padStart(2,'0')}:
    ${String(detik).padStart(2,'0')}
    `;

    time--;

    if(time < 0){

        clearInterval(hitung);

        alert("Waktu habis");

        submitQuiz();

    }

},1000);

</script>

</body>
</html>
