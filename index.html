<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulasi Ujian Informatika</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f2f2f2;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h1{
      text-align:center;
      color:#004aad;
    }

    .soal{
      margin-bottom:25px;
      padding:15px;
      border:1px solid #ddd;
      border-radius:8px;
      background:#fafafa;
    }

    .soal p{
      font-weight:bold;
    }

    label{
      display:block;
      margin:7px 0;
      cursor:pointer;
      padding:4px;
      border-radius:5px;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:8px;
      background:#004aad;
      color:white;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#00337a;
    }

    .benar{
      background:#b6f5b6;
    }

    .salah{
      background:#ffb3b3;
    }

    #hasil{
      margin-top:20px;
      text-align:center;
      font-size:24px;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="container">

<h1>Simulasi Ujian Informatika</h1>

<div id="quiz"></div>

<button onclick="cekJawaban()">Koreksi Jawaban</button>

<div id="hasil"></div>

</div>

<script>

const soal = [

{
t:"Microsoft Excel digunakan untuk?",

},

{

},

{
t:"Rumus Excel harus diawali dengan tanda?",

j:"="
},

{
t:"Rumus SUM digunakan untuk?",

j:"Menjumlahkan data"
},

{
t:"Rumus AVERAGE digunakan untuk?",
o:["Mencari rata-rata","Menjumlahkan","Mengurangi","Membagi"],
j:"Mencari rata-rata"
},

{
t:"Jenis data berupa angka disebut?",
o:["Numerik","Teks","Gambar","Video"],
j:"Numerik"
},

{
t:"Tujuan analisis data adalah?",
o:["Menghapus data","Memahami informasi","Merusak file","Menggambar"],
j:"Memahami informasi"
},

{
t:"SUMIF digunakan untuk?",
o:["Menjumlah data dengan syarat","Mencari nilai minimum","Menghitung data","Menghapus data"],
j:"Menjumlah data dengan syarat"
},

{
t:"Sel B3 berarti?",
o:["Kolom B baris 3","Baris B kolom 3","Kolom 3 baris B","Sheet B"],
j:"Kolom B baris 3"
},

{
t:"ScratchJr digunakan untuk belajar?",
o:["Memasak","Pemrograman dasar","Menggambar manual","Mengetik"],
j:"Pemrograman dasar"
},

{
t:"Urutan langkah-langkah untuk menyelesaikan masalah disebut?",
o:["Algoritma","Data","Program","Tabel"],
j:"Algoritma"
},

{
t:"Karakter pada ScratchJr disebut?",
o:["Sprite","Cell","Sheet","Pointer"],
j:"Sprite"
},

{
t:"Tempat sprite bergerak disebut?",

j:"Stage"
},

{
t:"Blok warna biru pada ScratchJr biasanya untuk?",
o:["Gerakan","Suara","Tampilan","Pengulangan"],
j:"Gerakan"
},

{
t:"Blok kuning pada ScratchJr digunakan untuk?",
o:["Memulai program","Menghapus sprite","Menggambar","Menyimpan"],
j:"Memulai program"
},

{
t:"Blok pengulangan digunakan untuk?",
o:["Mengulang perintah","Menghapus program","Mengubah warna","Mematikan aplikasi"],
j:"Mengulang perintah"
},

{
t:"Jika sprite bergerak maju 3 kali, berarti program melakukan?",
o:["Perulangan","Kesalahan","Penghapusan","Penyimpanan"],
j:"Perulangan"
},

{
t:"Informasi palsu di internet disebut?",
o:["Data","Hoax","Program","File"],
j:"Hoax"
},

{
t:"Cara menghadapi hoax adalah?",
o:["Langsung menyebarkan","Memeriksa kebenaran informasi","Menghapus HP","Marah"],
j:"Memeriksa kebenaran informasi"
},

{
t:"Media sosial yang digunakan berlebihan dapat menyebabkan?",
o:["Rajin belajar","Kecanduan","Sehat","Semangat olahraga"],
j:"Kecanduan"
},

{
t:"Jejak digital adalah?",
o:["Rekam aktivitas di internet","Bekas kaki","File kosong","Program komputer"],

},

{
t:"Contoh jejak digital adalah?",

},

{
t:"Data pribadi harus dijaga agar?",

j:"Aman"
},

{
t:"Ctrl + C berfungsi untuk?",

j:"Menyalin"
},

{
t:"Ctrl + V digunakan untuk?",

j:"Menempel"
},

{
t:"Baris pada Excel ditandai dengan?",

j:"Angka"

{

},

},

{

{

j:"Menghitung jumlah data"
},

{
t:"Data teks disebut juga?",
o:["String","Numerik","Video","Audio"],
j:"String"
},

{
t:"Aplikasi spreadsheet adalah?",

j:"Excel"
},

{
t:"File Excel memiliki ekstensi?",
o:[".xlsx",".ppt",".jpg",".mp3"],
j:".xlsx"
},

{
t:"Penggunaan media sosial yang baik adalah?",
o:["Sopan","Menghina","Menyebar hoax","Membully"],
j:"Sopan"
},

{
t:"Cyberbullying adalah?",
o:["Perundungan di internet","Belajar online","Main game","Video call"],
j:"Perundungan di internet"
},

{
t:"Teknologi membantu manusia dalam?",
o:["Komunikasi","Memperlambat pekerjaan","Menghapus file","Merusak data"],
j:"Komunikasi"

{
t:"ScratchJr menggunakan sistem?",

j:"Blok visual"
},

{
t:"Blok hijau pada ScratchJr biasanya berkaitan dengan?",

j:"Suara"
},

{
t:"Internet harus digunakan dengan?",
o:["Bijak","Sembarangan","Marah","Asal-asalan"],
j:"Bijak"
}

];

const quiz = document.getElementById("quiz");

soal.forEach((s,index)=>{

let div = document.createElement("div");
div.className = "soal";

let html = `<p>${index+1}. ${s.t}</p>`;

s.o.forEach(opt=>{
html += `
<label>
<input type="radio" name="soal${index}" value="${opt}">
${opt}
</label>
`;
});

div.innerHTML = html;
quiz.appendChild(div);

});

function cekJawaban(){

let skor = 0;

soal.forEach((s,index)=>{

const pilih = document.querySelector(`input[name="soal${index}"]:checked`);
const semua = document.querySelectorAll(`input[name="soal${index}"]`);

semua.forEach(i=>{

i.parentElement.classList.remove("benar","salah");

if(i.value === s.j){
i.parentElement.classList.add("benar");
}

if(pilih && i.checked && i.value !== s.j){
i.parentElement.classList.add("salah");
}

});

if(pilih && pilih.value === s.j){
skor++;
}

});

document.getElementById("hasil").innerHTML =
"Nilai Anda : " + skor + " / 40";

}

</script>

</body>
</html>
