<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Informatika</title>
  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f2f2f2;
      margin:0;
      padding:20px;
    }
    .container{
      max-width:900px;
      margin:auto;
      background:white;
      padding:25px;
      border-radius:12px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }
    h1{
      text-align:center;
      color:#1e3a8a;
    }
    .question{
      margin-bottom:25px;
      padding:15px;
      border-left:5px solid #2563eb;
      background:#f9fafb;
      border-radius:8px;
    }
    .question p{
      font-weight:bold;
    }
    button{
      display:block;
      width:100%;
      padding:15px;
      background:#2563eb;
      color:white;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
    }
    button:hover{
      background:#1d4ed8;
    }
    .result{
      margin-top:30px;
      padding:20px;
      background:#ecfeff;
      border-radius:10px;
    }
    .correct{
      color:green;
      font-weight:bold;
    }
    .wrong{
      color:red;
      font-weight:bold;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Ujian Informatika</h1>

  <form id="quizForm"></form>

  <button onclick="checkAnswers()">Submit Jawaban</button>

  <div class="result" id="result"></div>
</div>

<script>
const questions = [
{
q:"1. Program pengolah angka yang sering digunakan adalah ...",
o:["Ms. Excel","Paint","WordPad","Chrome"],
a:"Ms. Excel"
},
{
q:"2. Fungsi utama Microsoft Excel adalah ...",
o:["Mengolah angka","Mengedit video","Browsing","Menggambar"],
a:"Mengolah angka"
},
{
q:"3. File Excel memiliki ekstensi ...",
o:[".xlsx",".ppt",".jpg",".mp3"],
a:".xlsx"
},
{
q:"4. Perpotongan baris dan kolom disebut ...",
o:["Sel","Sheet","Range","Workbook"],
a:"Sel"
},
{
q:"5. Rumus Excel selalu diawali dengan ...",
o:["=","+","-","@"],
a:"="
},
{
q:"6. Fungsi SUM digunakan untuk ...",
o:["Menjumlahkan data","Menghitung rata-rata","Mencari data","Menghapus data"],
a:"Menjumlahkan data"
},
{
q:"7. Fungsi AVERAGE digunakan untuk ...",
o:["Menghitung rata-rata","Menjumlahkan","Mengurutkan","Menghapus"],
a:"Menghitung rata-rata"
},
{
q:"8. Rumus =SUM(A1:A5) berarti ...",
o:["Menjumlahkan A1 sampai A5","Mencari nilai terbesar","Membagi angka","Menghapus data"],
a:"Menjumlahkan A1 sampai A5"
},
{
q:"9. Data yang berupa angka disebut ...",
o:["Data numerik","Data teks","Data gambar","Data audio"],
a:"Data numerik"
},
{
q:"10. Tujuan analisis data adalah ...",
o:["Mendapat informasi","Menghapus data","Menggambar","Membuat game"],
a:"Mendapat informasi"
},
{
q:"11. Fungsi SUMIF digunakan untuk ...",
o:["Menjumlahkan dengan syarat","Menghapus data","Menghitung gambar","Membuat tabel"],
a:"Menjumlahkan dengan syarat"
},
{
q:"12. Contoh rumus SUMIF yang benar adalah ...",
o:["=SUMIF(A1:A5,\">70\")","SUMIF(A1:A5)","=AVERAGE(A1:A5)","=MAX(A1:A5)"],
a:"=SUMIF(A1:A5,\">70\")"
},
{
q:"13. Posisi sel B3 berarti ...",
o:["Kolom B baris 3","Kolom 3 baris B","Baris B kolom 3","Sel ke 3"],
a:"Kolom B baris 3"
},
{
q:"14. Huruf pada Excel menunjukkan ...",
o:["Kolom","Baris","Sheet","Rumus"],
a:"Kolom"
},
{
q:"15. Angka pada Excel menunjukkan ...",
o:["Baris","Kolom","Sel","Data"],
a:"Baris"
},
{
q:"16. Algoritma adalah ...",
o:["Langkah-langkah menyelesaikan masalah","Program game","Aplikasi gambar","Mesin pencari"],
a:"Langkah-langkah menyelesaikan masalah"
},
{
q:"17. ScratchJr digunakan untuk ...",
o:["Belajar coding anak","Mengedit video","Browsing","Mengetik surat"],
a:"Belajar coding anak"
},
{
q:"18. Sprite pada ScratchJr adalah ...",
o:["Karakter objek","Latar belakang","Suara","Tombol keluar"],
a:"Karakter objek"
},
{
q:"19. Stage pada ScratchJr adalah ...",
o:["Tempat sprite bergerak","Karakter","Rumus","Keyboard"],
a:"Tempat sprite bergerak"
},
{
q:"20. Blok biru pada ScratchJr biasanya untuk ...",
o:["Gerakan","Suara","Tampilan","Awal program"],
a:"Gerakan"
},
{
q:"21. Blok kuning pada ScratchJr berfungsi sebagai ...",
o:["Pemicu awal","Gerakan","Suara","Berhenti"],
a:"Pemicu awal"
},
{
q:"22. Blok hijau biasanya berkaitan dengan ...",
o:["Suara","Gerakan","Awal","Data"],
a:"Suara"
},
{
q:"23. Urutan langkah program disebut ...",
o:["Logika program","Wallpaper","Ikon","Data"],
a:"Logika program"
},
{
q:"24. Jika sprite tidak bergerak maka kemungkinan ...",
o:["Blok gerak belum dipasang","Komputer mati","Mouse rusak","Speaker rusak"],
a:"Blok gerak belum dipasang"
},
{
q:"25. Informasi palsu disebut ...",
o:["Hoax","Fakta","Data","Berita resmi"],
a:"Hoax"
},
{
q:"26. Cara menghadapi hoax adalah ...",
o:["Memeriksa sumber informasi","Langsung menyebarkan","Mempercayai semua berita","Menghapus akun"],
a:"Memeriksa sumber informasi"
},
{
q:"27. Jejak digital adalah ...",
o:["Rekaman aktivitas di internet","Jejak kaki","Data komputer rusak","Gambar digital"],
a:"Rekaman aktivitas di internet"
},
{
q:"28. Password yang baik sebaiknya ...",
o:["Sulit ditebak","Nama sendiri","123456","Tanggal lahir"],
a:"Sulit ditebak"
},
{
q:"29. Dampak negatif media sosial adalah ...",
o:["Kecanduan","Menambah teman","Belajar online","Berbagi informasi"],
a:"Kecanduan"
},
{
q:"30. Contoh data teks adalah ...",
o:["Nama siswa","Nilai 90","Tanggal","Rumus"],
a:"Nama siswa"
},
{
q:"31. Workbook pada Excel adalah ...",
o:["File Excel","Kolom","Baris","Rumus"],
a:"File Excel"
},
{
q:"32. Sheet adalah ...",
o:["Lembar kerja Excel","Rumus","Kolom","Baris"],
a:"Lembar kerja Excel"
},
{
q:"33. Fungsi utama tabel adalah ...",
o:["Merapikan data","Menggambar","Memutar musik","Menonton video"],
a:"Merapikan data"
},
{
q:"34. Blok merah pada ScratchJr biasanya berarti ...",
o:["Berhenti","Suara","Gerak","Awal"],
a:"Berhenti"
},
{
q:"35. Coding adalah ...",
o:["Membuat program","Menggambar","Mengetik","Menghapus data"],
a:"Membuat program"
},
{
q:"36. Internet harus digunakan secara ...",
o:["Bijak","Sembarangan","Berlebihan","Terus menerus"],
a:"Bijak"
},
{
q:"37. Data angka lebih mudah dianalisis menggunakan ...",
o:["Excel","Paint","Chrome","YouTube"],
a:"Excel"
},
{
q:"38. Rumus untuk mencari rata-rata adalah ...",
o:["AVERAGE","SUM","IF","COUNT"],
a:"AVERAGE"
},
{
q:"39. Media sosial dapat bermanfaat untuk ...",
o:["Belajar dan komunikasi","Menyebar hoax","Menipu orang","Merusak data"],
a:"Belajar dan komunikasi"
},
{
q:"40. Sebelum membagikan informasi kita harus ...",
o:["Memastikan kebenarannya","Langsung share","Menghapusnya","Diam saja"],
a:"Memastikan kebenarannya"
}
];

const form = document.getElementById("quizForm");

questions.forEach((item,index)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`<p>${item.q}</p>`;

  item.o.sort(()=>Math.random()-0.5);

  item.o.forEach(opt=>{
    html += `
    <label>
      <input type="radio" name="q${index}" value="${opt}">
      ${opt}
    </label><br>`;
  });

  div.innerHTML=html;
  form.appendChild(div);
});

function checkAnswers(){
  let score=0;
  let resultHTML="";

  questions.forEach((item,index)=>{
    let answer=document.querySelector(`input[name="q${index}"]:checked`);

    if(answer){
      if(answer.value===item.a){
        score++;
        resultHTML += `<p class="correct">✔ ${item.q} — Benar</p>`;
      } else {
        resultHTML += `<p class="wrong">✘ ${item.q}<br>
        Jawaban Anda: ${answer.value}<br>
        Jawaban Benar: ${item.a}</p>`;
      }
    } else {
      resultHTML += `<p class="wrong">✘ ${item.q}<br>
      Tidak dijawab<br>
      Jawaban Benar: ${item.a}</p>`;
    }
  });

  document.getElementById("result").innerHTML =
    `<h2>Nilai Anda: ${score} / ${questions.length}</h2>` + resultHTML;

  window.scrollTo(0,document.body.scrollHeight);
}
</script>

</body>
</html>
