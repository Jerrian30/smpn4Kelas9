<!DOCTYPE html>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f1f5f9;
    padding:15px;
    color:#222;
}

.container{
    max-width:1000px;
    margin:auto;
}

.header{
    background:#1e293b;
    color:white;
    padding:20px;
    border-radius:15px;
    margin-bottom:20px;
    text-align:center;
}

.header h1{
    font-size:28px;
}

.header p{
    margin-top:8px;
    opacity:.9;
}

.soal{
    background:white;
    padding:18px;
    border-radius:15px;
    margin-bottom:18px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.nomor{
    font-weight:bold;
    margin-bottom:10px;
    color:#0f172a;
    font-size:18px;
}

.pilihan label{
    display:block;
    margin:10px 0;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
    line-height:1.5;
}

.pilihan label:hover{
    background:#f8fafc;
    border-color:#3b82f6;
}

input[type=radio]{
    margin-right:10px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:14px;
    background:#16a34a;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    background:#15803d;
}

#hasil{
    margin-top:25px;
    padding:20px;
    border-radius:15px;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
    font-size:20px;
    font-weight:bold;
    text-align:center;
}

.benar{
    background:#dcfce7 !important;
    border-color:#16a34a !important;
}

.salah{
    background:#fee2e2 !important;
    border-color:#dc2626 !important;
}

@media(max-width:700px){

.header h1{
    font-size:22px;
}

.soal{
    padding:15px;
}

.pilihan label{
    font-size:14px;
}

button{
    font-size:16px;
}

}
</style>
</head>

const form = document.getElementById("quizForm");

soal.forEach((s,i)=>{

let html = `
<div class="soal">
<div class="nomor">Soal ${i+1}</div>
<p>${s.t}</p>
<div class="pilihan">
`;

s.o.forEach((opsi,index)=>{
html += `
<label id="label-${i}-${index}">
<input type="radio" name="soal${i}" value="${index}">
${opsi}
</label>
`;
});

html += `</div></div>`;

form.innerHTML += html;

});

function cekJawaban(){

let skor = 0;

soal.forEach((s,i)=>{

let jawab = document.querySelector(`input[name="soal${i}"]:checked`);

for(let j=0;j<4;j++){
document.getElementById(`label-${i}-${j}`).classList.remove("benar","salah");
}

if(jawab){

let nilai = parseInt(jawab.value);

if(nilai === s.a){
skor++;
document.getElementById(`label-${i}-${nilai}`).classList.add("benar");
}else{
document.getElementById(`label-${i}-${nilai}`).classList.add("salah");
document.getElementById(`label-${i}-${s.a}`).classList.add("benar");
}

}else{
document.getElementById(`label-${i}-${s.a}`).classList.add("benar");
}

});

document.getElementById("hasil").innerHTML =
"Nilai Anda : <br><br>" + skor + " / 40";

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}
